---
- name: Install Prometheus Operator CRDs (matching latest chart)
  command: >
    kubectl apply --server-side --force-conflicts -f
    https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.89.0/stripped-down-crds.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: crds_install
  changed_when: "'configured' in crds_install.stdout or 'created' in crds_install.stdout"

- name: Wait for Prometheus Operator CRDs to be registered
  command: kubectl get crd {{ item }}
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: crd_check
  retries: 30
  delay: 10
  until: crd_check.rc == 0
  changed_when: false
  loop:
    - servicemonitors.monitoring.coreos.com
    - podmonitors.monitoring.coreos.com
    - probes.monitoring.coreos.com
    - prometheusrules.monitoring.coreos.com
    - alertmanagers.monitoring.coreos.com
    - prometheuses.monitoring.coreos.com

- name: Create monitoring namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Add prometheus-community Helm repo
  command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  register: helm_repo
  changed_when: "'has been added' in helm_repo.stdout"
  failed_when: helm_repo.rc != 0 and 'already exists' not in helm_repo.stderr

- name: Update Helm repos
  command: helm repo update
  changed_when: false

- name: Install kube-prometheus-stack Helm chart
  command: >
    helm upgrade --install kube-prometheus-stack
    prometheus-community/kube-prometheus-stack
    --namespace monitoring
    --values {{ repo_root }}/apps/kube-prometheus-stack/values.yml
    --skip-crds
    --wait
    --timeout 10m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: helm_install
  changed_when: "'has been upgraded' in helm_install.stdout or 'has been installed' in helm_install.stdout"
