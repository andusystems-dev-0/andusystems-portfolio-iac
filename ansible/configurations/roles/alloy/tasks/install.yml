---
- name: Create alloy namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: alloy
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Add grafana Helm repo
  command: helm repo add grafana https://grafana.github.io/helm-charts
  register: helm_repo
  changed_when: "'has been added' in helm_repo.stdout"
  failed_when: helm_repo.rc != 0 and 'already exists' not in helm_repo.stderr

- name: Update Helm repos
  command: helm repo update
  changed_when: false

- name: Install Alloy Helm chart
  command: >
    helm upgrade --install alloy
    grafana/alloy
    --namespace alloy
    --values {{ repo_root }}/apps/alloy/values.yml
    --wait
    --timeout 10m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: helm_install
  changed_when: "'has been upgraded' in helm_install.stdout or 'has been installed' in helm_install.stdout"
