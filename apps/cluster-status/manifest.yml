---
# Status proxy deployment — aggregates health checks from all clusters.
#
# The nginx config is in a ConfigMap created by the management cluster's
# Ansible role (apps/andusystems-portfolio/cluster-status-proxy-config.yml),
# NOT by ArgoCD. This mirrors the nexus-registry-credentials pattern:
# Ansible bootstraps the secret/config, ArgoCD manages the workload.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-status
  namespace: cluster-status
  labels:
    app: cluster-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-status
  template:
    metadata:
      labels:
        app: cluster-status
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /api/status/portfolio
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status/portfolio
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: proxy-config
          configMap:
            name: cluster-status-proxy-config
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-status
  namespace: cluster-status
  labels:
    app: cluster-status
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: cluster-status
---
# IngressRoute on the portfolio.andusystems.com host — PathPrefix ensures
# Traefik prefers this over the portfolio catch-all route for /api/status paths.
# Cross-namespace service routing is enabled (allowCrossNamespace: true).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cluster-status-api
  namespace: cluster-status
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: (Host(`portfolio.andusystems.com`) || Host(`alexddev.com`)) && PathPrefix(`/api/status`)
      kind: Rule
      services:
        - name: cluster-status
          port: 80
  tls:
    secretName: cluster-status-api-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-status-api-tls
  namespace: cluster-status
spec:
  secretName: cluster-status-api-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - portfolio.andusystems.com
    - alexddev.com
