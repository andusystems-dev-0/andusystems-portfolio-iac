---
# Daily cleanup of stuck/orphaned Longhorn snapshots across all volumes.
# Without this, failed snapshot operations (e.g. aborted backups) leave
# copy-on-write snapshot data behind that grows the on-disk footprint
# until kubelet evicts pods under disk pressure.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup-daily
  namespace: longhorn-system
spec:
  # Longhorn's RecurringJob CRD requires spec.name in addition to
  # metadata.name; the admission webhook rejects the resource without it.
  name: snapshot-cleanup-daily
  cron: "0 3 * * *"
  task: snapshot-cleanup
  groups:
    - default
  # snapshot-cleanup only deletes orphaned snapshots, so retain is unused;
  # set to 0 to satisfy the schema.
  retain: 0
  concurrency: 2
