# apps/portfolio/registry-secret.yml
#
# imagePullSecret for pulling the portfolio image from Nexus on the storage
# cluster (registry.andusystems.com). Templated by Ansible from vault vars,
# applied to the portfolio cluster as a bootstrap step BEFORE ArgoCD/kubectl
# applies the workload that references it.
#
# The .dockerconfigjson value is a JSON document containing per-registry
# auth tokens. The "auth" field is base64(user:password), which Jinja2
# generates inline below using b64encode.
#
# Mirrors the storage cluster's loki/tempo/nexus bootstrap secret pattern:
# Jinja2-templated by Ansible, NOT consumed by ArgoCD.
---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-registry-credentials
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: registry-pull-credentials
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.andusystems.com": {
          "username": "{{ nexus_cluster_puller_user }}",
          "password": "{{ nexus_cluster_puller_password }}",
          "auth": "{{ (nexus_cluster_puller_user + ':' + nexus_cluster_puller_password) | b64encode }}"
        }
      }
    }
